hunt:
  # World name where the hunt game takes place
  world: "hunt"

  # Spawn location where players are teleported when using /hunt
  spawn:
    x: 100.0
    y: 65.0
    z: 200.0
    yaw: 0.0
    pitch: 0.0

  # Disguise locations where armor stands with player disguises are placed
  disguise-locations:
    # Each location has a unique identifier
    location1:
      # World coordinates
      x: 100.5
      y: 65.0
      z: 200.5
      # Rotation (in degrees)
      # yaw: left/right rotation (0=north, 90=east, 180=south, 270=west)
      # pitch: up/down rotation (-90=looking up, 0=level, 90=looking down)
      yaw: 0.0
      pitch: 0.0
      # Player skin to disguise the armor stand as (actual player name for skin)
      player-skin: "Springtrap"
      # Display name to show above the armor stand
      display-name: "Springtrap"
      # Scale of the armor stand (default 1.3)
      scale: 1.3
      # Whether this location is enabled
      enabled: true

    location2:
      x: 105.5
      y: 65.0
      z: 205.5
      yaw: 90.0
      pitch: 0.0
      player-skin: "Herobrine"
      display-name: "Herobrine"
      scale: 1.3
      enabled: true

    location3:
      x: 110.5
      y: 65.0
      z: 210.5
      yaw: 180.0
      pitch: -10
      player-skin: "FoxyTheFierce"
      display-name: "Slenderman"
      scale: 1.3
      enabled: true

    location4:
      x: 115.5
      y: 65.0
      z: 215.5
      yaw: 270.0
      pitch: 0.0
      player-skin: "Cryptid"
      display-name: "Cryptid"
      scale: 1.3
      enabled: true

    location5:
      x: 120.5
      y: 65.0
      z: 220.5
      yaw: 45.0
      pitch: 0.0
      player-skin: "Jigsaw"
      display-name: "Jigsaw"
      scale: 1.3
      enabled: true

    location6:
      x: 125.5
      y: 65.0
      z: 225.5
      yaw: 135.0
      pitch: 0.0
      player-skin: "Scarecrow"
      display-name: "Scarecrow"
      scale: 1.3
      enabled: true

  # Disguise settings
  disguise:
    # How long a disguise lasts (in seconds, 0 = permanent until removed)
    duration: 0
    # Scale to apply to disguised players
    player-scale: 1.3
    # Whether to show the display name above the disguised player (true = show display name, false = hide name)
    retain-username: true
    # Cooldown between disguise attempts (in seconds)
    cooldown: 3

  # Utility item cooldowns (in seconds)
  utility-cooldowns:
    # Brute class - Resilience Totem (provides temporary resistance)
    resilience-totem: 30
    # Nimble class - Dash (provides speed boost)
    dash: 15
    # Saboteur class - Scanner (reveals nearby hiders)
    scanner: 25

  # Hologram locations for class selection and gamemode display
  holograms:
    # Game mode selection display
    gamemode-selection:
      x: 100.0
      y: 70.0
      z: 200.0

    # Hunter class selection displays
    hunter-classes:
      brute:
        x: 90.0
        y: 67.0
        z: 195.0
      nimble:
        x: 93.0
        y: 67.0
        z: 195.0
      saboteur:
        x: 96.0
        y: 67.0
        z: 195.0

    # Hider class selection displays
    hider-classes:
      trickster:
        x: 90.0
        y: 67.0
        z: 197.0
      phaser:
        x: 93.0
        y: 67.0
        z: 197.0
      cloaker:
        x: 96.0
        y: 67.0
        z: 197.0

  # Prep phase configuration
  prep-phase:
    # Location for the "START GAME" hologram
    start-hologram:
      x: 95.0
      y: 67.0
      z: 195.0

    # Map voting hologram locations (names must match HuntMap enum values)
    map-vote-holograms:
      castle:
        x: 88.0
        y: 66.0
        z: 190.0
      mountain:
        x: 90.0
        y: 66.0
        z: 190.0
      medieval:
        x: 92.0
        y: 66.0
        z: 190.0
      industrial:
        x: 94.0
        y: 66.0
        z: 190.0
      office:
        x: 96.0
        y: 66.0
        z: 190.0
      backrooms:
        x: 98.0
        y: 66.0
        z: 190.0

    # Ready tracking hologram location
    ready-status:
      x: 100.0
      y: 67.0
      z: 195.0

    # Countdown settings
    countdown-duration: 5 # seconds

    # Game duration (in minutes)
    game-duration: 5

    # Hunter lock-in duration (in seconds)
    hunter-lock-duration: 30

    # Heartbeat system configuration
    heartbeat:
      # Distance in blocks for hunter detection (when hiders hear heartbeat)
      detection-radius: 15.0
      # Interval between heartbeat checks (in ticks, 20 ticks = 1 second)
      interval-ticks: 40
      # Proximity-based heartbeat configuration
      proximity:
        # Maximum interval when hunter is far (at detection radius edge)
        max-interval-ticks: 60 # 3 seconds when hunter is far
        # Minimum interval when hunter is very close
        min-interval-ticks: 8 # 0.4 seconds when hunter is very close
        # Distance zones for different heartbeat intensities
        very-close-distance: 3.0 # Within 3 blocks = very fast heartbeat
        close-distance: 7.0 # Within 7 blocks = fast heartbeat
        medium-distance: 12.0 # Within 12 blocks = medium heartbeat
        # Sound configuration
        volume: 0.7
        pitch: 0.8
        # Visual effects
        action-bar-enabled: true
        title-flash-enabled: true

  # Map configurations
  maps:
    warehouse:
      display-name: "Warehouse"
      description: "Industrial warehouse with lots of hiding spots"
      world: "hunt_warehouse"
      # Hunter spawn location (locked area)
      hunter-spawn:
        x: 0.0
        y: 64.0
        z: 0.0
        yaw: 0.0
        pitch: 0.0
      # Hider spawn locations (multiple spawn points)
      hider-spawns:
        - x: 50.0
          y: 64.0
          z: 50.0
          yaw: 0.0
          pitch: 0.0
        - x: -50
          y: 64.0
          z: 50.0
          yaw: 90.0
          pitch: 0.0
        - x: 50.0
          y: 64.0
          z: -50
          yaw: 180.0
          pitch: 0.0
        - x: -50
          y: 64.0
          z: -50
          yaw: 270.0
          pitch: 0.0

    factory:
      display-name: "Factory"
      description: "Abandoned factory with machinery and conveyor belts"
      world: "hunt_factory"
      hunter-spawn:
        x: 0.0
        y: 64.0
        z: 0.0
        yaw: 0.0
        pitch: 0.0
      hider-spawns:
        - x: 75.0
          y: 64.0
          z: 75.0
          yaw: 0.0
          pitch: 0.0
        - x: -75
          y: 64.0
          z: 75.0
          yaw: 90.0
          pitch: 0.0
        - x: 75.0
          y: 64.0
          z: -75
          yaw: 180.0
          pitch: 0.0
        - x: -75
          y: 64.0
          z: -75
          yaw: 270.0
          pitch: 0.0

    mansion:
      display-name: "Mansion"
      description: "Spooky mansion with many rooms and secret passages"
      world: "hunt_mansion"
      hunter-spawn:
        x: 0.0
        y: 64.0
        z: 0.0
        yaw: 0.0
        pitch: 0.0
      hider-spawns:
        - x: 100.0
          y: 64.0
          z: 100.0
          yaw: 0.0
          pitch: 0.0
        - x: -100
          y: 64.0
          z: 100.0
          yaw: 90.0
          pitch: 0.0
        - x: 100.0
          y: 64.0
          z: -100
          yaw: 180.0
          pitch: 0.0
        - x: -100
          y: 64.0
          z: -100
          yaw: 270.0
          pitch: 0.0

    backrooms:
      display-name: "Backrooms"
      description: "Endless maze of yellow rooms with fluorescent lighting"
      world: "hunt_backrooms"
      hunter-spawn:
        x: 0.0
        y: 64.0
        z: 0.0
        yaw: 0.0
        pitch: 0.0
      hider-spawns:
        - x: 30.0
          y: 64.0
          z: 30.0
          yaw: 0.0
          pitch: 0.0
        - x: -30.0
          y: 64.0
          z: 30.0
          yaw: 90.0
          pitch: 0.0
        - x: 30.0
          y: 64.0
          z: -30.0
          yaw: 180.0
          pitch: 0.0
        - x: -30.0
          y: 64.0
          z: -30.0
          yaw: 270.0
          pitch: 0.0
        - x: 60.0
          y: 64.0
          z: 0.0
          yaw: 0.0
          pitch: 0.0
        - x: -60.0
          y: 64.0
          z: 0.0
          yaw: 180.0
          pitch: 0.0
        - x: 0.0
          y: 64.0
          z: 60.0
          yaw: 270.0
          pitch: 0.0
        - x: 0.0
          y: 64.0
          z: -60.0
          yaw: 90.0
          pitch: 0.0

  # Hider ability cooldowns (in seconds)
  hider-abilities:
    # Trickster class - Trap ability (places slowness traps for hunters)
    trickster-cooldown: 45
    # Phaser class - Phase ability (allows flying through walls)
    phaser-cooldown: 60
    # Cloaker class - Invisibility ability (grants temporary invisibility)
    cloaker-cooldown: 90
    # Block disguise cooldown (for all hiders - transform into blocks)
    block-disguise-cooldown: 30

  # Imposter Hunt gamemode configuration
  imposter:
    # Game duration in seconds (5 minutes default)
    game-duration: 300

    # Role assignment ratios
    roles:
      # One murderer per X players (minimum 1)
      murderer-ratio: 6
      # One sheriff per X players (minimum 1)
      sheriff-ratio: 8

    # Weapon cooldowns (in seconds)
    cooldowns:
      # Murderer throwable weapon cooldown
      throwable: 10
      # Sheriff investigation cooldown
      investigation: 30

    # Coin system configuration
    coins:
      # Coins required to buy a zapper
      coins-for-zapper: 10
      # How often coins spawn (in seconds)
      spawn-interval: 30
      # Maximum coins that can exist on the map at once
      max-coins: 20

    # Weapon ranges (in blocks)
    ranges:
      # Sheriff zapper range
      sheriff-zapper: 10
      # Innocent zapper range
      innocent-zapper: 8
      # Throwable weapon velocity multiplier
      throwable-velocity: 2.0
