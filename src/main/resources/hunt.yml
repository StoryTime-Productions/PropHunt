hunt:
  # World name where the hunt game takes place
  world: "hunt"

  # Spawn location where players are teleported when using /hunt
  spawn:
    x: 100.0
    y: 65.0
    z: 200.0
    yaw: 0.0
    pitch: 0.0

  # Disguise locations where armor stands with player disguises are placed
  disguise-locations:
    # Each location has a unique identifier
    location1:
      # World coordinates
      x: 100.5
      y: 65.0
      z: 200.5
      # Rotation (in degrees)
      # yaw: left/right rotation (0=north, 90=east, 180=south, 270=west)
      # pitch: up/down rotation (-90=looking up, 0=level, 90=looking down)
      yaw: 0.0
      pitch: 0.0
      # Player skin to disguise the armor stand as (actual player name for skin)
      player-skin: "Springtrap"
      # Display name to show above the armor stand
      display-name: "Springtrap"
      # Scale of the armor stand (default 1.3)
      scale: 1.3
      # Whether this location is enabled
      enabled: true

    location2:
      x: 105.5
      y: 65.0
      z: 205.5
      yaw: 90.0
      pitch: 0.0
      player-skin: "Herobrine"
      display-name: "Herobrine"
      scale: 1.3
      enabled: true

    location3:
      x: 110.5
      y: 65.0
      z: 210.5
      yaw: 180.0
      pitch: -10
      player-skin: "FoxyTheFierce"
      display-name: "Slenderman"
      scale: 1.3
      enabled: true

    location4:
      x: 115.5
      y: 65.0
      z: 215.5
      yaw: 270.0
      pitch: 0.0
      player-skin: "Cryptid"
      display-name: "Cryptid"
      scale: 1.3
      enabled: true

    location5:
      x: 120.5
      y: 65.0
      z: 220.5
      yaw: 45.0
      pitch: 0.0
      player-skin: "Jigsaw"
      display-name: "Jigsaw"
      scale: 1.3
      enabled: true

    location6:
      x: 125.5
      y: 65.0
      z: 225.5
      yaw: 135.0
      pitch: 0.0
      player-skin: "Scarecrow"
      display-name: "Scarecrow"
      scale: 1.3
      enabled: true

  # Disguise settings
  disguise:
    # How long a disguise lasts (in seconds, 0 = permanent until removed)
    duration: 0
    # Scale to apply to disguised players
    player-scale: 1.3
    # Whether to show the display name above the disguised player (true = show display name, false = hide name)
    retain-username: true
    # Cooldown between disguise attempts (in seconds)
    cooldown: 3
    # Distance (in blocks) within which a lobby disguise NPC turns to face a nearby player.
    # Purely visual and per-player (packet-based) — 0 disables the effect.
    stare-distance: 6.0

  # Utility item cooldowns (in seconds)
  utility-cooldowns:
    # Brute class - Shockwave (see specs/brute-rebrand-research.md): knocks back and reveals
    # disguised hiders caught in the blast radius. Replaced the old Resilience Totem.
    brute-shockwave: 30
    brute-shockwave-radius: 6.0
    brute-shockwave-glow-seconds: 4
    # Nimble class - Dash (provides speed boost)
    dash: 15
    # Saboteur class - Scanner (reveals nearby hiders)
    scanner: 25

  # Hologram locations for class selection and gamemode display
  holograms:
    # Game mode selection display
    gamemode-selection:
      x: 100.0
      y: 70.0
      z: 200.0

    # Hunter class selection displays
    hunter-classes:
      brute:
        x: 90.0
        y: 67.0
        z: 195.0
      nimble:
        x: 93.0
        y: 67.0
        z: 195.0
      saboteur:
        x: 96.0
        y: 67.0
        z: 195.0

    # Hider class selection displays
    hider-classes:
      trickster:
        x: 90.0
        y: 67.0
        z: 197.0
      phaser:
        x: 93.0
        y: 67.0
        z: 197.0
      cloaker:
        x: 96.0
        y: 67.0
        z: 197.0

  # Prep phase configuration
  prep-phase:
    # Location for the "START GAME" hologram
    start-hologram:
      x: 95.0
      y: 67.0
      z: 195.0

    # Map voting hologram locations (names must match HuntMap enum values)
    map-vote-holograms:
      castle:
        x: 88.0
        y: 66.0
        z: 190.0
      mountain:
        x: 90.0
        y: 66.0
        z: 190.0
      medieval:
        x: 92.0
        y: 66.0
        z: 190.0
      industrial:
        x: 94.0
        y: 66.0
        z: 190.0
      office:
        x: 96.0
        y: 66.0
        z: 190.0

    # Ready tracking hologram location
    ready-status:
      x: 100.0
      y: 67.0
      z: 195.0

    # Countdown settings
    countdown-duration: 5 # seconds

    # Game duration (in minutes)
    game-duration: 5

    # Hunter lock-in duration (in seconds)
    hunter-lock-duration: 30

    # Heartbeat system configuration
    heartbeat:
      # Distance in blocks for hunter detection (when hiders hear heartbeat)
      detection-radius: 15.0
      # Interval between heartbeat checks (in ticks, 20 ticks = 1 second)
      interval-ticks: 40
      # Proximity-based heartbeat configuration
      proximity:
        # Maximum interval when hunter is far (at detection radius edge)
        max-interval-ticks: 60 # 3 seconds when hunter is far
        # Minimum interval when hunter is very close
        min-interval-ticks: 8 # 0.4 seconds when hunter is very close
        # Distance zones for different heartbeat intensities
        very-close-distance: 3.0 # Within 3 blocks = very fast heartbeat
        close-distance: 7.0 # Within 7 blocks = fast heartbeat
        medium-distance: 12.0 # Within 12 blocks = medium heartbeat
        # Sound configuration
        volume: 0.7
        pitch: 0.8
        # Visual effects
        action-bar-enabled: true
        title-flash-enabled: true

    # "Recently hurt" combat-tension state - see specs/recently-hurt-tension.md.
    # Independent of the proximity heartbeat above: driven by hits, not hunter distance.
    hurt-tension:
      # How long after the last hit (with no hunter within medium-distance above)
      # before the tension state clears.
      timeout-seconds: 10
      # Fixed-pace elevated heartbeat while the state is active (not distance-scaled).
      heartbeat-interval-ticks: 18 # ~0.9s
      heartbeat-volume: 0.65
      heartbeat-pitch: 1.0
      # Raid-bell alarm - a burst of rings fired immediately on every hit (no periodic
      # repeat; a slow timer felt too delayed during active combat).
      bell-ring-min-count: 4
      bell-ring-max-count: 6
      bell-ring-interval-min-ticks: 8
      bell-ring-interval-max-ticks: 10
      bell-volume: 0.9
      # Keeps ringing a fresh burst on this interval for as long as the hurt state is active -
      # not just once per hit - so it doesn't go quiet until the hider actually gets away.
      bell-repeat-interval-seconds: 5

    # Idle-triggered spotlight reveal - see specs/idle-spotlight.md. Periodically forces
    # whichever disguised hider has been stationary longest to briefly undisguise and glow,
    # so no spot is perfectly safe to camp forever. A hider who keeps moving stays safe.
    spotlight:
      # A hider must be stationary at least this long before being revealed. Each hider has
      # their own personal countdown (shown on their action bar), not a shared scan.
      min-idle-seconds: 12
      # Warning cue fires this long before the actual reveal.
      telegraph-lead-seconds: 2
      # How long the forced reveal (undisguise + glow) lasts.
      glow-duration-seconds: 5
      # A hider who was just spotlighted can't be picked again for this long, so with
      # multiple idle hiders it rotates instead of fixating on one. Kept much closer to
      # min-idle-seconds than the original 90s - that gap made a single re-trigger per
      # round read as "never happens again."
      reselect-cooldown-seconds: 25

  # Map configurations
  maps:
    warehouse:
      display-name: "Warehouse"
      description: "Industrial warehouse with lots of hiding spots"
      world: "hunt_warehouse"
      # Hunter spawn location (locked area)
      hunter-spawn:
        x: 0.0
        y: 64.0
        z: 0.0
        yaw: 0.0
        pitch: 0.0
      # Hider spawn locations (multiple spawn points)
      hider-spawns:
        - x: 50.0
          y: 64.0
          z: 50.0
          yaw: 0.0
          pitch: 0.0
        - x: -50
          y: 64.0
          z: 50.0
          yaw: 90.0
          pitch: 0.0
        - x: 50.0
          y: 64.0
          z: -50
          yaw: 180.0
          pitch: 0.0
        - x: -50
          y: 64.0
          z: -50
          yaw: 270.0
          pitch: 0.0

    factory:
      display-name: "Factory"
      description: "Abandoned factory with machinery and conveyor belts"
      world: "hunt_factory"
      hunter-spawn:
        x: 0.0
        y: 64.0
        z: 0.0
        yaw: 0.0
        pitch: 0.0
      hider-spawns:
        - x: 75.0
          y: 64.0
          z: 75.0
          yaw: 0.0
          pitch: 0.0
        - x: -75
          y: 64.0
          z: 75.0
          yaw: 90.0
          pitch: 0.0
        - x: 75.0
          y: 64.0
          z: -75
          yaw: 180.0
          pitch: 0.0
        - x: -75
          y: 64.0
          z: -75
          yaw: 270.0
          pitch: 0.0

    mansion:
      display-name: "Mansion"
      description: "Spooky mansion with many rooms and secret passages"
      world: "hunt_mansion"
      hunter-spawn:
        x: 0.0
        y: 64.0
        z: 0.0
        yaw: 0.0
        pitch: 0.0
      hider-spawns:
        - x: 100.0
          y: 64.0
          z: 100.0
          yaw: 0.0
          pitch: 0.0
        - x: -100
          y: 64.0
          z: 100.0
          yaw: 90.0
          pitch: 0.0
        - x: 100.0
          y: 64.0
          z: -100
          yaw: 180.0
          pitch: 0.0
        - x: -100
          y: 64.0
          z: -100
          yaw: 270.0
          pitch: 0.0

  # Hider ability cooldowns (in seconds)
  hider-abilities:
    # Trickster class - Trap ability (places slowness traps for hunters)
    trickster-cooldown: 45 # unused - see trickster-strike-cooldown below
    # Trickster class - Stun-on-hit ability (see specs/trickster-stun-on-hit.md), replacing
    # the old placed tripwire trap.
    trickster-strike-cooldown: 12
    trickster-stun-duration-seconds: 5
    # Phaser class - Phase ability (allows flying through walls)
    phaser-cooldown: 30
    # Phaser class - max wall thickness (in blocks) it will search through beyond the
    # point of impact looking for a safe pocket on the other side. Hard-capped at 256
    # regardless of this value.
    phaser-max-wall-thickness: 64
    # Phaser class - max angle (in degrees) off perpendicular the player can be looking at the
    # wall and still phase through. Prevents diagonal/glancing phase attempts.
    phaser-max-angle-degrees: 15.0
    # Cloaker class - Invisibility ability (grants temporary invisibility)
    cloaker-cooldown: 35
    # Cloaker class - how long the invisibility lasts. Was 10s/90s (~11% uptime) but still felt
    # overpowered in playtesting because of zero counterplay (see specs/cloaker-balance.md) -
    # shortened further alongside closing the Scanner-immunity gap.
    cloaker-duration-seconds: 6
    # Block disguise cooldown (for all hiders - transform into blocks)
    block-disguise-cooldown: 30

  # Imposter Hunt gamemode configuration
  imposter:
    # Game duration in seconds (5 minutes default)
    game-duration: 300

    # Role assignment ratios
    roles:
      # One murderer per X players (minimum 1)
      murderer-ratio: 6
      # One sheriff per X players (minimum 1)
      sheriff-ratio: 8

    # Weapon cooldowns (in seconds)
    cooldowns:
      # Murderer throwable weapon cooldown
      throwable: 10
      # Sheriff investigation cooldown
      investigation: 30

    # Coin system configuration
    coins:
      # Coins required to buy a zapper
      coins-for-zapper: 10
      # How often coins spawn (in seconds)
      spawn-interval: 30
      # Maximum coins that can exist on the map at once
      max-coins: 20

    # Weapon ranges (in blocks)
    ranges:
      # Sheriff zapper range
      sheriff-zapper: 10
      # Innocent zapper range
      innocent-zapper: 8
      # Throwable weapon velocity multiplier
      throwable-velocity: 2.0

  # Passive ambient tracking (Dead by Daylight-inspired scratch marks / red stain equivalents).
  # Only active in map worlds, never the lobby. See RalphDocs specs/ambient-tracking-layer.md.
  tracking:
    # How often (in ticks) the tracking system updates. Lower = smoother but more particles sent.
    interval-ticks: 4
    # How long (in seconds) a hider's footprint trail point stays visible to hunters.
    footprint-lifetime-seconds: 4.0
    # Max distance (in blocks) a hunter can see footprint trail particles from.
    footprint-max-visible-distance: 20.0
    # How far (in blocks) a hunter's facing cone extends in front of them.
    facing-cone-range-blocks: 6.0
    # Max distance (in blocks) a hider can see a hunter's facing cone particles from.
    facing-cone-max-visible-distance: 20.0
